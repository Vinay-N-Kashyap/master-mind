[project]
name = "master-memory"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vinay-N-Kashyap", email = "vinayrocker2002@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "networkx>=3.7",
    "pydantic>=2.13.5",
    "tree-sitter>=0.26.0",
